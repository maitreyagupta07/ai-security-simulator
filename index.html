<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Enterprise AI Security Architecture Lab</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
<script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<style>
  :root{
    --bg:#f4f6fa;--surface:#ffffff;--surface-2:#f8fafc;
    --border:#e2e6ee;--border-2:#d4d9e3;
    --ink:#0f172a;--ink-2:#334155;--ink-3:#64748b;--ink-4:#94a3b8;
    --accent:#2563eb;--accent-2:#1d4ed8;--accent-soft:rgba(37,99,235,.10);
    --detroit-line:rgba(15,23,42,.035);--detroit-line2:rgba(15,23,42,.025);--detroit-line3:rgba(15,23,42,.03);
    --card-bg:linear-gradient(180deg,#ffffff 0%, #fbfcfe 100%);
    --icon-tile:linear-gradient(135deg,#1e293b,#0f172a);
    --icon-tile-ink:#e2e8f0;
    --cta-bg:linear-gradient(135deg,#0f172a,#1e293b);
    --cta-ink:#f8fafc;
    --hero-grad:linear-gradient(180deg,#0f172a 0%,#334155 100%);
    --glow-1:rgba(37,99,235,.10);--glow-2:rgba(15,23,42,.08);
    --hover-shadow:0 30px 70px -30px rgba(37,99,235,.35), 0 1px 0 rgba(15,23,42,.02);
  }
  html.dark{
    --bg:#0F172A;--surface:#1E293B;--surface-2:#162032;
    --border:rgba(255,255,255,0.08);--border-2:rgba(255,255,255,0.14);
    --ink:#F1F5F9;--ink-2:#CBD5E1;--ink-3:#94A3B8;--ink-4:#64748B;
    --accent:#3B82F6;--accent-2:#60A5FA;--accent-soft:rgba(59,130,246,.18);
    --detroit-line:rgba(99,179,237,.05);--detroit-line2:rgba(99,179,237,.03);--detroit-line3:rgba(99,179,237,.04);
    --card-bg:linear-gradient(180deg,#1e293b 0%, #182238 100%);
    --icon-tile:linear-gradient(135deg,#3b82f6,#1d4ed8);
    --icon-tile-ink:#f8fafc;
    --cta-bg:linear-gradient(135deg,#2563eb,#1d4ed8);
    --cta-ink:#f8fafc;
    --hero-grad:linear-gradient(180deg,#f8fafc 0%,#94a3b8 100%);
    --glow-1:rgba(59,130,246,.18);--glow-2:rgba(59,130,246,.10);
    --hover-shadow:0 30px 80px -28px rgba(59,130,246,.45), 0 0 0 1px rgba(59,130,246,.20);
  }
  html,body,#root{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;transition:background .35s,color .35s;min-height:100vh}
  *{box-sizing:border-box}
  .detroit-bg{
    background-color:var(--bg);
    background-image:
      radial-gradient(1200px 600px at 80% -10%, var(--glow-1), transparent 60%),
      radial-gradient(900px 500px at 0% 110%, var(--glow-2), transparent 60%),
      linear-gradient(135deg,var(--detroit-line) 0 18%,transparent 18% 32%,var(--detroit-line2) 32% 50%,transparent 50% 64%,var(--detroit-line3) 64% 82%,transparent 82% 100%);
    background-size:auto,auto,520px 520px;
  }
  .chip{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
  .divider{height:1px;background:linear-gradient(90deg,transparent,var(--border-2),transparent)}
  .journey-card{position:relative;isolation:isolate;background:var(--card-bg);border:1px solid var(--border);border-radius:22px;padding:36px;cursor:pointer;transition:transform .55s cubic-bezier(.2,.7,.2,1),box-shadow .55s,border-color .55s;box-shadow:0 1px 0 rgba(15,23,42,.02),0 20px 40px -28px rgba(15,23,42,.18);overflow:hidden}
  .journey-card::before{content:"";position:absolute;inset:0;border-radius:22px;pointer-events:none;background:linear-gradient(135deg,transparent,var(--accent-soft));opacity:0;transition:opacity .6s;z-index:0}
  .journey-card::after{content:"";position:absolute;top:-40%;right:-30%;width:560px;height:560px;pointer-events:none;background:radial-gradient(closest-side,var(--accent-soft),transparent 70%);opacity:0;transition:opacity .6s;z-index:0}
  .journey-card > *{position:relative;z-index:1}
  .journey-card:hover{transform:translateY(-8px);border-color:rgba(59,130,246,.45);box-shadow:var(--hover-shadow)}
  .journey-card:hover::before,.journey-card:hover::after{opacity:1}
  .arrow-pill{position:absolute;top:32px;right:32px;z-index:2;width:42px;height:42px;border-radius:999px;display:flex;align-items:center;justify-content:center;background:var(--surface-2);border:1px solid var(--border);color:var(--ink-3);transition:transform .45s cubic-bezier(.2,.7,.2,1),background .35s,color .35s,border-color .35s}
  .journey-card:hover .arrow-pill{transform:translate(4px,-2px) rotate(-12deg);background:var(--cta-bg);color:var(--cta-ink);border-color:transparent}
  .icon-tile{width:64px;height:64px;border-radius:18px;display:flex;align-items:center;justify-content:center;background:var(--icon-tile);color:var(--icon-tile-ink);box-shadow:0 12px 30px -12px rgba(15,23,42,.55),inset 0 1px 0 rgba(255,255,255,.08);transition:transform .6s cubic-bezier(.2,.7,.2,1)}
  .journey-card:hover .icon-tile{transform:rotate(-4deg) scale(1.05)}
  .step{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;background:var(--surface-2);border:1px solid var(--border);font-size:13px;color:var(--ink-2);font-weight:500;transition:all .3s}
  .step .num{font-size:10px;font-weight:700;color:var(--ink-4);letter-spacing:.12em;min-width:18px}
  .step-connector{width:2px;height:10px;margin-left:22px;background:linear-gradient(180deg,var(--border-2),transparent)}
  .hint-row{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--accent-2)}
  .top-link{font-size:13px;color:var(--ink-3);font-weight:500;transition:color .2s;cursor:pointer;background:transparent;border:0;padding:0;font-family:inherit}
  .top-link:hover{color:var(--ink)}
  .theme-btn{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface);border:1px solid var(--border);color:var(--ink-2);transition:all .25s;cursor:pointer}
  .theme-btn:hover{color:var(--ink);border-color:var(--border-2)}
  .nav-btn{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:10px;background:var(--surface);border:1px solid var(--border);color:var(--ink-2);font-size:13px;font-weight:600;cursor:pointer;transition:all .25s;font-family:inherit}
  .nav-btn:hover{color:var(--ink);border-color:var(--accent);background:var(--accent-soft)}
  .nav-btn.primary{background:var(--cta-bg);color:var(--cta-ink);border-color:transparent}
  .nav-btn.primary:hover{transform:translateY(-1px);box-shadow:0 10px 24px -10px rgba(37,99,235,.5)}
  .fade-in{animation:fadeUp .9s cubic-bezier(.2,.7,.2,1) both}
  .fade-in-d1{animation:fadeUp .9s .12s cubic-bezier(.2,.7,.2,1) both}
  .fade-in-d2{animation:fadeUp .9s .24s cubic-bezier(.2,.7,.2,1) both}
  .fade-in-d3{animation:fadeUp .9s .36s cubic-bezier(.2,.7,.2,1) both}
  @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .intro-leaving{animation:leave .55s cubic-bezier(.6,0,.4,1) forwards}
  @keyframes leave{to{opacity:0;transform:scale(.985);filter:blur(6px)}}
  .sim-enter{animation:simIn .7s cubic-bezier(.2,.7,.2,1) both}
  @keyframes simIn{from{opacity:0;transform:scale(1.01);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
  .hero-eyebrow{display:inline-flex;align-items:center;gap:10px;padding:6px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--border);color:var(--ink-3);font-size:11px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;box-shadow:0 8px 20px -16px rgba(15,23,42,.4)}
  .hero-eyebrow .dot{width:6px;height:6px;border-radius:999px;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
  .hero-title{font-size:clamp(44px,6.8vw,84px);line-height:1.01;letter-spacing:-.03em;font-weight:700;background:var(--hero-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;font-size:11px;font-weight:600;background:var(--accent-soft);color:var(--accent-2)}
  .arch-row{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:0;border:1px solid var(--border);border-radius:14px;overflow:hidden;background:var(--surface)}
  .arch-row > div{padding:18px 20px;border-right:1px solid var(--border)}
  .arch-row > div:last-child{border-right:none}
  .arch-row + .arch-row{margin-top:10px}
  .brand-tile{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--icon-tile);color:var(--icon-tile-ink)}
  .sim-host{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg);z-index:50}
  .sim-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 18px;border-bottom:1px solid var(--border);background:var(--surface);backdrop-filter:blur(8px);flex:0 0 auto}
  .sim-frame{flex:1;width:100%;border:0;background:var(--bg)}
</style>
</head>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useMemo } = React;

const Icon = ({name, size=16}) => {
  const ref = useRef(null);
  useEffect(() => {
    if(!ref.current || !window.lucide) return;
    ref.current.innerHTML="";
    const node = lucide.icons[name];
    if(!node) return;
    const svg = lucide.createElement(node);
    svg.setAttribute("width",size); svg.setAttribute("height",size);
    ref.current.appendChild(svg);
  }, [name,size]);
  return <span ref={ref} style={{display:"inline-flex"}}/>;
};

const GENAI=["Basic Chatbot","Enterprise Knowledge","Threat Surface","Guardrails","Architecture Hardening","Attack Replay","Security Validation"];
const AGENT=["Unrestricted Agent","Privilege Review","Threat Surface","Security Controls","Restricted Agent","SIEM Detection","Attack Replay"];

function b64ToUtf8(s){ return decodeURIComponent(escape(atob(s))); }

function buildSimSrcdoc(key, dark){
  const id = key==='genai' ? '__genai_html' : '__agent_html';
  const raw = document.getElementById(id).textContent.trim();
  let html = b64ToUtf8(raw);
  const inject = '<script>window.__INITIAL_DARK__='+(dark?'true':'false')+';if('+(dark?'true':'false')+'){document.documentElement.classList.add("dark");}<\/script>';
  html = html.replace(/(<\/head>)/i, inject + '$1');
  return html;
}

function JourneyCard({index,iconName,title,subtitle,steps,hint,onLaunch}){
  return (
    <div className="journey-card fade-in-d2" role="button" tabIndex={0}
      onClick={onLaunch}
      onKeyDown={e=>{ if(e.key==="Enter"||e.key===" "){e.preventDefault();onLaunch();} }}>
      <div className="arrow-pill"><Icon name="ArrowRight" size={18}/></div>
      <div className="flex items-start justify-between" style={{paddingRight:56}}>
        <div className="icon-tile"><Icon name={iconName} size={28}/></div>
        <div className="chip">Track {index}</div>
      </div>
      <h3 className="mt-7" style={{fontSize:28,fontWeight:600,letterSpacing:"-.01em",lineHeight:1.15}}>{title}</h3>
      <p className="mt-3" style={{fontSize:14.5,lineHeight:1.65,color:"var(--ink-2)"}}>{subtitle}</p>
      <div className="divider my-7"/>
      <div className="chip mb-4">Journey</div>
      <div className="flex flex-col">
        {steps.map((s,i)=>(
          <div key={s}>
            <div className="step">
              <span className="num">{String(i+1).padStart(2,"0")}</span>
              <Icon name="ChevronRight" size={12}/>
              <span>{s}</span>
            </div>
            {i<steps.length-1 && <div className="step-connector"/>}
          </div>
        ))}
      </div>
      <div className="mt-7 hint-row">{hint} <Icon name="ArrowRight" size={14}/></div>
    </div>
  );
}

function ArchRow({label,genai,agentic}){
  return (
    <div className="arch-row">
      <div><div className="chip mb-1">{label}</div></div>
      <div>
        <div style={{fontSize:11,fontWeight:600,letterSpacing:".08em",textTransform:"uppercase",marginBottom:4,color:"var(--accent-2)"}}>Generative AI</div>
        <div style={{fontSize:13.5,color:"var(--ink-2)"}}>{genai}</div>
      </div>
      <div>
        <div style={{fontSize:11,fontWeight:600,letterSpacing:".08em",textTransform:"uppercase",marginBottom:4,color:"var(--accent-2)"}}>Agentic AI</div>
        <div style={{fontSize:13.5,color:"var(--ink-2)"}}>{agentic}</div>
      </div>
    </div>
  );
}

function IntroPage({dark,setDark,onLaunch,leaving}){
  return (
    <div className={leaving?"intro-leaving":""}>
      <header className="w-full border-b" style={{borderColor:"var(--border)"}}>
        <div className="max-w-[1280px] mx-auto px-8 py-4 flex items-center justify-between">
          <div/>
          <div className="flex items-center gap-6">
            <nav className="hidden md:flex items-center gap-6">
              <button className="top-link" onClick={()=>onLaunch("genai")}>Generative AI</button>
              <span style={{color:"var(--ink-4)"}}>|</span>
              <button className="top-link" onClick={()=>onLaunch("agent")}>Agentic AI</button>
            </nav>
            <button aria-label="Toggle theme" className="theme-btn" onClick={()=>setDark(d=>!d)}>
              <Icon name={dark?"Sun":"Moon"} size={16}/>
            </button>
          </div>
        </div>
      </header>

      <section className="max-w-[1280px] mx-auto px-8 pt-20 pb-16">
        <div className="fade-in hero-eyebrow mb-7">
          <span className="dot"/><Icon name="Sparkles" size={11}/> Enterprise Architecture Showcase
        </div>
        <h1 className="hero-title fade-in-d1" style={{maxWidth:1040}}>AI Security Architecture</h1>
        <p className="fade-in-d2 mt-7" style={{maxWidth:760,fontSize:17,lineHeight:1.75,color:"var(--ink-2)"}}>
          Explore how modern organizations secure both Generative AI systems and Agentic AI systems through architecture design, governance, controls, monitoring and attack simulation.
        </p>
        <div className="fade-in-d3 mt-8 flex items-center gap-3" style={{color:"var(--ink-3)"}}>
          <span className="pill"><Icon name="Lock" size={11}/> Prevent</span>
          <span className="pill"><Icon name="Eye" size={11}/> Detect</span>
          <span className="pill"><Icon name="Activity" size={11}/> Govern</span>
        </div>
      </section>

      <section className="max-w-[1280px] mx-auto px-8 pb-20">
        <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
          <JourneyCard index="01" iconName="BrainCircuit"
            title="Generative AI Security"
            subtitle="Transform a basic enterprise chatbot into a secure GenAI platform through architecture hardening, guardrails and attack validation."
            steps={GENAI} hint="Enter the GenAI Journey" onLaunch={()=>onLaunch("genai")}/>
          <JourneyCard index="02" iconName="Bot"
            title="Agentic AI Security"
            subtitle="Transform an unrestricted enterprise agent into a governed, monitored and detectable AI system."
            steps={AGENT} hint="Enter the Agentic AI Journey" onLaunch={()=>onLaunch("agent")}/>
        </div>
      </section>

      <section className="max-w-[1280px] mx-auto px-8 pb-24">
        <h2 style={{fontSize:28,fontWeight:700,letterSpacing:"-.015em",marginBottom:24}}>Architecture Overview</h2>
        <ArchRow label="Primary Goal" genai="Protect knowledge, prompts and outputs of an enterprise assistant." agentic="Constrain, monitor and govern an autonomous agent's actions."/>
        <ArchRow label="Threats" genai="Prompt injection · data leakage · jailbreaks · RAG poisoning." agentic="Privilege abuse · tool misuse · lateral movement · goal hijack."/>
        <ArchRow label="Controls" genai="Guardrails · input/output filters · retrieval policies · isolation." agentic="Least privilege · scoped tools · approvals · runtime policy enforcement."/>
        <ArchRow label="Validation" genai="Adversarial prompt replay against the hardened pipeline." agentic="SIEM detection and replay of malicious agent behaviors."/>
      </section>

      <footer className="border-t" style={{borderColor:"var(--border)"}}>
        <div className="max-w-[1280px] mx-auto px-8 py-12 flex flex-wrap items-center justify-between gap-6">
          <div>
            <div style={{fontSize:15,fontWeight:600,letterSpacing:"-.01em"}}>Two security domains. One architecture mindset.</div>
            <div style={{marginTop:4,fontSize:13,color:"var(--ink-3)"}}>Prevent. Detect. Govern.</div>
          </div>
          <div className="chip">Enterprise AI Security Architecture Lab</div>
        </div>
      </footer>
    </div>
  );
}

function SimView({track,dark,setDark,onHome,onSwitch}){
  const srcdoc = useMemo(()=>buildSimSrcdoc(track,dark),[track,dark]);
  return (
    <div className="sim-host sim-enter">
      <div className="sim-bar">
        <div/>
        <div className="flex items-center gap-2">
          <button className="nav-btn" onClick={onHome}>
            <Icon name="Home" size={14}/> Home
          </button>
          <button className="nav-btn primary" onClick={onSwitch}>
            <Icon name={track==='genai'?'Bot':'BrainCircuit'} size={14}/>
            Switch to {track==='genai'?'Agentic AI':'Generative AI'}
          </button>
          <button aria-label="Toggle theme" className="theme-btn" onClick={()=>setDark(d=>!d)}>
            <Icon name={dark?"Sun":"Moon"} size={16}/>
          </button>
        </div>
      </div>
      <iframe key={track+":"+(dark?'d':'l')} className="sim-frame" srcDoc={srcdoc} title={track}/>
    </div>
  );
}

function App(){
  // Dark default true; persists if user changes
  const [dark,setDark]=useState(()=>{
    try { const s=localStorage.getItem("lab-theme"); if(s==="light") return false; if(s==="dark") return true; } catch(e){}
    return true;
  });
  useEffect(()=>{ document.documentElement.classList.toggle("dark",dark); try{localStorage.setItem("lab-theme",dark?"dark":"light");}catch(e){} },[dark]);

  const [view,setView]=useState("intro"); // 'intro' | 'sim'
  const [track,setTrack]=useState(null);
  const [leaving,setLeaving]=useState(false);

  const launch=(t)=>{
    setLeaving(true);
    setTimeout(()=>{ setTrack(t); setView("sim"); setLeaving(false); }, 520);
  };
  const goHome=()=>{ setView("intro"); setTrack(null); window.scrollTo(0,0); };
  const switchTrack=()=>{ setTrack(t=> t==='genai'?'agent':'genai'); };

  if(view==='sim' && track){
    return <SimView track={track} dark={dark} setDark={setDark} onHome={goHome} onSwitch={switchTrack}/>;
  }
  return <IntroPage dark={dark} setDark={setDark} onLaunch={launch} leaving={leaving}/>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
